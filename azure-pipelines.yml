# https://aka.ms/yaml

trigger:
- none

pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: 'acr-connection'
  frontendrepository: 'credpay/fronted'
  userepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'


stages:
  - stage: TerraformApply
    displayName: Terraform Apply
    jobs:
      - job: 
        displayName: Terraform Apply
        steps:
          - task: TerraformInstaller@1
            inputs:
              terraformVersion: 'latest'
          - task: AzureCLI@3
            inputs:
              connectionType: 'azureRM'
              azureSubscription: 'ThirdAccount'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                terraform init
                terraform validate
              workingDirectory: 'terraform'



